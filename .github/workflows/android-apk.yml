# Bölüm 26: Android teslimi. GitHub'a gönderilen her commit'te testleri koşar ve imzasız hata ayıklama APK'sı üretir.
name: android-apk
on:
  push:
  workflow_dispatch:
jobs:
  apk:
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with: { node-version: 22, cache: npm }
      - run: npm ci
      - name: Tip denetimi, lint ve kabul testleri
        run: npm run tip && npm run lint && npm test
      - name: Web paketi ve Capacitor eşitleme
        run: npm run build && cd apps/android && npx cap sync android
      - uses: actions/setup-java@v5
        with: { distribution: temurin, java-version: '21' }
      - name: Android SDK
        uses: android-actions/setup-android@v3
        with:
          # eski 'tools' paketi kaldırıldı; yalnız gerekenler kurulur
          packages: 'platform-tools platforms;android-36 build-tools;35.0.0'
      - name: APK derle
        working-directory: apps/android/android
        run: chmod +x gradlew && ./gradlew assembleDebug --no-daemon
      - uses: actions/upload-artifact@v4
        with:
          name: tarih-strateji-apk
          path: apps/android/android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
      - name: APK'yı "son-surum" sürümüne koy (doğrudan indirme bağlantısı)
        if: github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cp apps/android/android/app/build/outputs/apk/debug/app-debug.apk tarih-strateji.apk
          gh release delete son-surum --yes --cleanup-tag || true
          gh release create son-surum tarih-strateji.apk --target "$GITHUB_SHA" --prerelease \
            --title "Tarih Strateji — son sürüm" \
            --notes "Otomatik derleme · commit ${GITHUB_SHA::7}. Telefona kurulum: tarih-strateji.apk dosyasını indirin, bilinmeyen kaynaklardan kuruluma izin verin."
      - name: APK'yı "onizleme" sürümüne koy (çalışma dalı; doğrudan indirme bağlantısı)
        if: github.ref != 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          SURUM=$(node -p "require('./package.json').version")
          cp apps/android/android/app/build/outputs/apk/debug/app-debug.apk tarih-strateji-onizleme.apk
          gh release delete onizleme --yes --cleanup-tag || true
          zip -j tarih-strateji-onizleme.zip tarih-strateji-onizleme.apk
          gh release create onizleme tarih-strateji-onizleme.apk tarih-strateji-onizleme.zip --target "$GITHUB_SHA" --prerelease \
            --title "Tarih Strateji ${SURUM} — önizleme (${GITHUB_REF_NAME})" \
            --notes "Henüz ana dala alınmamış çalışma dalının otomatik derlemesi · commit ${GITHUB_SHA::7}. Telefona kurulum: tarih-strateji-onizleme.apk dosyasını indirin (inmezse zip dosyasını indirip APK'yı çıkarın), bilinmeyen kaynaklardan kuruluma izin verin."
